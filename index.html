<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="header-container">
            <div class="logo"><strong>My Portfolio</strong></div>
            <nav class="nav">
                <a href="#">Home</a>
                <a href="#">Gallery</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <section class="hero">
            <div class="hero-text">
                <h1>Data and Design</h1>
                <p>Clean layout, responsive grid, no frameworks.</p>
                <a href="#" class="btn">See Gallery</a>
            </div>
            <div class="hero-card">
                <h3>KPI</h3>
                <p class="stat">72%</p>
            </div>
        </section>

        <section class="grid">
            <div class="card">Card 1</div>
            <div class="card">Card 2</div>
            <div class="card">Card 3</div>
            <div class="card">Card 4</div>
        </section>
    </div>

    <footer class="footer">
        &copy; 2026
    </footer>

</body>
</html>
